name: Android de teste
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['android/**', 'capacitor.config.json', 'package*.json', '.github/workflows/android.yml']
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - run: npm ci
      - run: npm test
      - run: node tests/pwa.test.js
      - run: npm run build
      - run: npx cap sync android
      - name: Gerar APK de teste e bundle sem assinatura
        working-directory: android
        run: bash gradlew assembleDebug bundleRelease --no-daemon
      - uses: actions/upload-artifact@v4
        with:
          name: carrer-baska-android-teste
          retention-days: 14
          path: |
            android/app/build/outputs/apk/debug/*.apk
            android/app/build/outputs/bundle/release/*.aab
